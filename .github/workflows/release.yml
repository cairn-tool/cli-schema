name: Release

# Gated on CI rather than on push. cairn shipped a broken v1.0.2 by releasing
# off `push` while the matrix was still red. Waiting for CI means the whole
# support matrix has passed, and lets this job skip re-running the tests.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  # `npm ci` runs `prepare: husky`, which would install the commit-msg hook into
  # the runner's checkout — and that hook would then reject semantic-release's
  # own release commit. Git hooks have no purpose in CI.
  HUSKY: 0

jobs:
  release:
    name: Publish npm and NuGet
    runs-on: ubuntu-latest
    permissions:
      # semantic-release writes the tag, the CHANGELOG commit and the GitHub
      # Release through the built-in GITHUB_TOKEN, so this job needs write.
      contents: write
      # OIDC, for the nuget.org key exchange and npm provenance.
      id-token: write
    # Only for a green CI run on a push to main — not for PR CI runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicit ref: a workflow_run checkout otherwise defaults to the
          # default branch tip anyway, and naming it keeps us on a branch rather
          # than a detached HEAD, which semantic-release needs in order to push.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@cairn-tool"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Trusted publishing needs npm >= 11.5.1. Node 22 bundled 10.9.7; this
      # job uses .nvmrc (26), but we still pin npm@12 so the OIDC exchange is
      # performed by a client that supports it.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@12

      - run: npm ci
      - run: npm run build

      # Exchanges this job's OIDC token for a short-lived nuget.org API key
      # under the trusted-publishing policy on the `user` account. The policy
      # is bound to this repository and this workflow filename (no
      # environment), so renaming the file breaks publishing. There is no
      # stored NuGet secret; the policy allows new package IDs, so the first
      # push needs no manual bootstrap. `--skip-duplicate` in the publish
      # command makes a re-run safe.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: bstockus

      # npm auth precedence is the plugin's own: it attempts the OIDC exchange
      # first and falls back to NPM_TOKEN only if that fails. Keeping the token
      # here therefore costs nothing when a trusted publisher is registered, and
      # is what keeps releases working when one is not.
      #
      # To go keyless: register a trusted publisher for BOTH @cairn-tool/cli-schema
      # and @cairn-tool/cli-schema-commander against this repository and this
      # workflow's filename, then delete NPM_TOKEN and NODE_AUTH_TOKEN below.
      # After that a missing or misnamed publisher fails at verifyConditions,
      # before a tag exists, instead of silently publishing on a credential.
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: npx semantic-release
